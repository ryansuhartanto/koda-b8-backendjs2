services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${PGUSER}"
      POSTGRES_PASSWORD: "${PGPASSWORD}"
      POSTGRES_DB: "${PGDATABASE}"
    volumes:
      - db:/var/lib/postgresql
      # only run on an empty volume, in file name order
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      retries: 10
  api:
    image: backendjs2/api:latest
    build:
      context: .
      target: api
    environment:
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:${API_PORT}"
    expose:
      - "${API_PORT}"
  web:
    image: backendjs2/web:latest
    build:
      context: .
      target: web
    ports:
      - "4173:${WEB_PORT}"
    expose:
      - "${WEB_PORT}"

volumes:
  db:
